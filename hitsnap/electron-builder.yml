appId: app.hitsnap.desktop
productName: HitSnap
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: HitSnap
mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.music
linux:
  icon: build/icon.png
  target: AppImage
  category: Game
