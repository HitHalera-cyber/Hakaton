appId: app.hitsnap.desktop
productName: HitSnap
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: HitSnap-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: HitSnap
  runAfterFinish: true
  installerLanguages: [ru_RU]
  language: "1049"
  uninstallDisplayName: HitSnap
portable:
  artifactName: HitSnap-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.music
linux:
  icon: build/icon.png
  target: AppImage
  category: Game
