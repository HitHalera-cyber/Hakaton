name: HitSnap Windows build

# Builds the HitSnap installer and portable .exe for the hitsnap project.
on:
  push:
    paths:
      - "hitsnap/**"
      - ".github/workflows/hitsnap-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hitsnap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hitsnap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build installer and portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: HitSnap-windows
          path: |
            hitsnap/release/*.exe
          if-no-files-found: error
