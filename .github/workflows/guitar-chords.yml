name: Guitar Chords — сборка

on:
  push:
    paths:
      - 'guitar-chords/**'
      - '.github/workflows/guitar-chords.yml'
  pull_request:
    paths:
      - 'guitar-chords/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: guitar-chords

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guitar-chords/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              guitar-chords/release/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              guitar-chords/release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: |
              guitar-chords/release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guitar-chords/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarChords-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
